<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易人数分布</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background:#f4f7f6; margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; }
        .container { width:100%; max-width:1200px; background:white; padding:24px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.08); overflow-x:auto; box-sizing:border-box; }
        h2 { color:#333; text-align:center; margin-bottom:0.5rem; }
        .filter { color:#555; text-align:center; margin-bottom:1rem; font-size:0.95rem; }
        .controls { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:0.75rem; margin-bottom:1rem; font-size:0.9rem; }
        .controls select { padding:4px 8px; font-size:0.9rem; }
        .controls input[type="number"] { width:80px; padding:4px 6px; font-size:0.9rem; }
        .controls button { padding:4px 10px; font-size:0.9rem; cursor:pointer; }
        .chart-panel { margin:18px 0 24px; border:1px solid #edf0f2; border-radius:8px; padding:12px; }
        #trendChart { width:100%; height:400px; }
        .stat-table { width:100%; border-collapse:collapse; font-size:14px; }
        .stat-table th { background:#0066cc; color:white; padding:10px; text-align:center; white-space:nowrap; }
        .stat-table td { padding:10px; text-align:center; border-bottom:1px solid #e0e0e0; color:#444; }
        .stat-table tr:hover { background:#f8f9fa; }
        .note { margin-top:1rem; color:#555; font-size:0.9rem; text-align:center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>交易人数分布</h2>
        <div class="controls">
            <form method="get" action="/pyapi/user/distribution">
                <label>交易人数类型：
                    <select name="user_type">
                        <option value="开仓人数" {% if user_type == "开仓人数" %}selected{% endif %}>开仓人数</option>
                        <option value="平仓人数" {% if user_type == "平仓人数" %}selected{% endif %}>平仓人数</option>
                        <option value="开仓+平仓 人数" {% if user_type == "开仓+平仓 人数" %}selected{% endif %}>开仓+平仓 人数</option>
                        <option value="开仓人数(A)" {% if user_type == "开仓人数(A)" %}selected{% endif %}>开仓人数(A)</option>
                        <option value="平仓人数(A)" {% if user_type == "平仓人数(A)" %}selected{% endif %}>平仓人数(A)</option>
                        <option value="开仓+平仓 人数(A)" {% if user_type == "开仓+平仓 人数(A)" %}selected{% endif %}>开仓+平仓 人数(A)</option>
                    </select>
                </label>
                <label>起始年度：
                    <input type="number" name="start_year" value="{{ start_year }}" min="2000" max="2035" />
                </label>
                <label>结束年度：
                    <input type="number" name="end_year" value="{{ end_year }}" min="2000" max="2035" />
                </label>
                <button type="submit">查询</button>
            </form>
        </div>
        <div class="chart-panel">
            <div id="trendChart"></div>
        </div>
        {{ table_html | safe }}
    </div>
    <script>
        const chartData = {{ chart_data | safe }};
        const selectedType = {{ user_type | tojson }};
        const chart = echarts.init(document.getElementById("trendChart"));
        chart.setOption({
            title: { text: `${selectedType}年度趋势`, left: "center" },
            tooltip: { trigger: "axis" },
            legend: { data: [selectedType], top: 35 },
            grid: { left: 60, right: 25, top: 80, bottom: 45 },
            xAxis: { type: "category", name: "交易年度", data: chartData.map(row => row["年度"]) },
            yAxis: { type: "value", name: "人数", splitLine: { lineStyle: { type: "dashed" } } },
            series: [{
                name: selectedType,
                type: "line",
                smooth: true,
                symbolSize: 8,
                data: chartData.map(row => row["交易人数"]),
                areaStyle: { opacity: .1 },
            }],
        });
        window.addEventListener("resize", () => chart.resize());
    </script>
</body>
</html>
